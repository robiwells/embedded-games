[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
    adafruit/Adafruit PN532@^1.3.1
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#v2.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_ENABLED=0
    -DCONFIG_WIFI_ENABLED=0

build_src_filter =
    +<*>
    -<mocks/>

monitor_speed = 115200

[env:esp32dev-release]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
    adafruit/Adafruit PN532@^1.3.1
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#v2.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_ENABLED=0
    -DCONFIG_WIFI_ENABLED=0
    -Os

build_src_filter =
    +<*>
    -<mocks/>

monitor_speed = 115200

[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
    bblanchon/ArduinoJson@^6.21.3

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_ENABLED=0
    -DCONFIG_WIFI_ENABLED=0
    -DWOKWI_SIMULATION

build_src_filter =
    +<*>
    -<nfc_handler.cpp>
    -<audio_player.cpp>
    -<data_logger.cpp>
    -<hardware.cpp>
    +<../src/mocks/nfc_handler_wokwi.cpp>
    +<../src/mocks/audio_player_wokwi.cpp>
    +<../src/mocks/data_logger_wokwi.cpp>
    +<../src/mocks/hardware_wokwi.cpp>

monitor_speed = 115200

[env:native]
platform = native
build_flags =
    -DUNIT_TEST
    -std=c++11
    -Iinclude
    -Itest/mocks

lib_deps =
    throwtheswitch/Unity@^2.6.0

build_src_filter =
    -<*>
    -<.git/>
    -<.svn/>

test_framework = unity
test_build_src = yes
