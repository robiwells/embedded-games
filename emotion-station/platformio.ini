[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
    adafruit/Adafruit PN532@^1.3.1
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#v2.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_ENABLED=0
    -DCONFIG_WIFI_ENABLED=0
    -Isrc/utils
    -Isrc/activity_manager
    -Isrc/audio_player
    -Isrc/data_logger
    -Isrc/event_bus
    -Isrc/game
    -Isrc/hardware
    -Isrc/led_controller
    -Isrc/mood_registry
    -Isrc/nfc_handler
    -Isrc/session_manager
    -Isrc/time_service

build_src_filter =
    +<*>
    -<*/tests/>
    -<*/audio_player_wokwi.cpp>
    -<*/data_logger_wokwi.cpp>
    -<*/hardware_wokwi.cpp>
    -<*/nfc_handler_wokwi.cpp>
    -<*/activity_repository_wokwi.cpp>

monitor_speed = 115200

[env:esp32dev-release]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
    adafruit/Adafruit PN532@^1.3.1
    bblanchon/ArduinoJson@^6.21.3
