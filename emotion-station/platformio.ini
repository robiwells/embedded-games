[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
    adafruit/Adafruit PN532@^1.3.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_ENABLED=0
    -DCONFIG_WIFI_ENABLED=0

monitor_speed = 115200

[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_ENABLED=0
    -DCONFIG_WIFI_ENABLED=0
    -DWOKWI_SIMULATION

monitor_speed = 115200

[env:native]
platform = native
build_flags =
    -DUNIT_TEST
    -std=c++11
    -Iinclude
    -Itest/mocks

lib_deps =
    throwtheswitch/Unity@^2.6.0

build_src_filter =
    -<*>
    -<.git/>
    -<.svn/>

test_framework = unity
test_build_src = yes
